labelspace_description: |
  <Labelspace Description>
  These are subset of labels in a scene graph. The full list should be quiered (if it is not in your context), before looking up objects/locations. 
  Cypher Query: (MATCH (o:Object) RETURN DISTINCT o.class AS object_type). Note similar queries can be used for rooms.
  Synonyms should be mapped to existing labels in the graph.
  <object_labels>
    tree
    car
    van
    truck
    cone
    hospital
    government_center
    barracks
    warehouse
    box
    flag
    window
    door
    sign
    seating
    pole
  </object_labels>
  <room_labels>
    parking lot
    intersection
    road
  </room_labels>
  </Labelspace Description>
