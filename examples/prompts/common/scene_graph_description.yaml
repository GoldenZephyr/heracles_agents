scene_graph_description: |
  <Scene Graph Description>
  A 3D scene graph is a hierarchical graph consisting of layers that each contain nodes. Graphs have the MESH PLACES layer, the OBJECTS layer, and the ROOMS layer.
  2D Places Layer (MESH_PLACES): The 2D Places layer contains Places that are reachable locations in the world with a possible semantic class (type). Each Place node has a unique ID (t<id>).
  Objects Layer (OBJECTS): The Objects layer contains Objects that exist in the world. Each Object has a unique ID (O<id>), a semantic class (type), an x,y,z position (pos), and a parent. The parent can be a Place or a Mesh Place, indicating which Place or Mesh Place the Object belongs to. Each Object will be represented in the form: (id, type, pos, parent_place).
  Rooms Layer (ROOMS): The Rooms Layer contains Rooms that exist in the world. Each Room has a unique ID (R<id>), a semantic class (type), and an x,y,z position (pos). Each Room will be represented in the form: (R<id>, type, pos). 
  The hierarchy is strict: an Object's parent is always a Mesh Place. A Mesh Place's parent is always a Room. Therefore, to find all objects in a room, you must first find all places that are children of that room, and then find all objects that have one of those places as a parent.
  </Scene Graph Description>
